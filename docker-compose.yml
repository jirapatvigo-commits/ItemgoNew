services:
  mysql:
    image: mysql:8.4
    container_name: itemgo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: itemgo-local
      MYSQL_DATABASE: itemgo
      MYSQL_USER: itemgo
      MYSQL_PASSWORD: itemgo-local
    ports:
      - '3306:3306'
    volumes:
      - itemgo_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-pitemgo-local']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  itemgo_mysql_data:
